# SPDX-License-Identifier: Apache-2.0
#
# The image and chart are already on GHCR. This only sets their visibility.
# Public cannot be switched back to private. Do not echo GH_TOKEN.

name: nri-shared-cpus visibility

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  public:
    name: set GHCR packages public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the image and the chart public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def call(method, url, data=None):
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as err:
                  return err.code, err.read().decode("utf-8", "replace")

          lists = (
              "https://api.github.com/user/packages?package_type=container&per_page=100",
              "https://api.github.com/users/mimran1980/packages?package_type=container&per_page=100",
              "https://api.github.com/repos/mimran1980/ergon/packages?package_type=container&per_page=100",
          )
          found = []
          for url in lists:
              status, raw = call("GET", url)
              path = url.split("github.com", 1)[-1]
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  print(f"GET {status} {path} unparsed", flush=True)
                  continue
              if isinstance(data, dict):
                  print(f"GET {status} {path} {data.get('message', '')[:160]}", flush=True)
                  continue
              print(f"GET {status} {path} count {len(data)}", flush=True)
              for pkg in data:
                  name = pkg.get("name", "")
                  vis = pkg.get("visibility", "")
                  pkg_url = pkg.get("url", "")
                  print(f"pkg {name} {vis}", flush=True)
                  if name in ("ergon-shared-cpus", "charts/ergon-shared-cpus"):
                      found.append(pkg_url)

          if not found:
              raise SystemExit("no ergon-shared-cpus package in the lists above")

          failed = False
          for pkg_url in found:
              status, raw = call("PATCH", pkg_url, b'{"visibility":"public"}')
              message = ""
              visibility = ""
              try:
                  body = json.loads(raw)
                  message = body.get("message", "")[:160]
                  visibility = body.get("visibility", "")
              except json.JSONDecodeError:
                  message = raw[:160]
              print(f"PATCH {status} {visibility or message}", flush=True)
              if not (status == 200 and visibility == "public"):
                  failed = True
          if failed:
              raise SystemExit(1)
          PY
