# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: ergon-shared-cpus
description: >-
  Give a Kubernetes pod its exclusive CPUs and the node's shared housekeeping
  CPUs. Containerd NRI plugin and kubelet device plugin in one daemon.
type: application
# Chart version. Tracks the chart, not the image. 0.1.1 is in git only.
# The published OCI chart is still 0.1.0. Publish is workflow_dispatch; do
# not treat this version as released.
version: 0.1.1
# Default image tag. The published image is 0.1.0. A newer binary is not
# on the registry.
appVersion: "0.1.0"
home: https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
sources:
  - https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
keywords:
  - nri
  - cpu-manager
  - cpuset
  - latency
  - latency-pods
maintainers:
  - name: Mohammed Imran
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: >-
        Git chart 0.1.1, not published. Renders every config.File field,
        repository@digest when image.digest is set, and an admission
        ownership switch. The OCI chart remains 0.1.0. EKS and latency
        benchmarks are still open.
