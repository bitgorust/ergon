# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: ergon-shared-cpus
description: >-
  Give a Kubernetes pod its exclusive CPUs and the node's shared housekeeping
  CPUs. Containerd NRI plugin and kubelet device plugin in one daemon.
type: application
# Chart version. The publish workflow packages this file with --version and
# --app-version set to the dispatch tag. Git appVersion stays 0.1.0 until
# that tag is on GHCR. EKS is not verified. Latency is not measured.
version: 0.1.1
# Default image tag for a render from this git tree. The workflow overrides
# it for the OCI package.
appVersion: "0.1.0"
home: https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
sources:
  - https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
keywords:
  - nri
  - cpu-manager
  - cpuset
  - latency
  - latency-pods
maintainers:
  - name: Mohammed Imran
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: >-
        Chart 0.1.1 renders every config.File field, repository@digest
        when image.digest is set, and an admission ownership switch.
        EKS is not verified. Latency figures are not measured.
